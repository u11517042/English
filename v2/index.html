<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英打遊戲版本 2</title><style>
[hidden]{display:none!important}:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#243e38;background:#f5f3ec;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:36px 24px}h1{font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:12px 0 18px}h2{font-size:22px}p{margin:12px 0}a{color:#205d50}button,input{font:inherit}button,.action{display:inline-block;padding:12px 22px;border:1px solid #426d5e;background:#426d5e;color:#fff;border-radius:12px;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#284c40}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled),.action:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #b16b35;outline-offset:4px}.eyebrow{font-size:13px;letter-spacing:.14em;color:#596f62}.panel{background:white;border:1px solid #ccd7ce;border-radius:20px;padding:24px;margin:20px 0}.muted,small{color:#526459}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#message{min-height:2em}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:white;border:1px solid #ccd7ce;border-radius:18px;padding:24px;min-height:260px}.card p{flex:1}.badge{font-size:12px;color:#526459}.card a{margin-top:14px}@media(max-width:700px){main{padding:22px 14px}.cards{grid-template-columns:1fr}.card{min-height:190px}.panel{padding:16px}}
</style></head><body><main><p class="eyebrow">TYPING PREVIEW</p><h1>英打遊戲版本 2</h1><p>先暖暖手，遊戲即將登場。</p><section class="panel"><img id="keyboardImage" src="keyboard.png" alt="英文鍵盤示意圖，中央列為 ASDFGHJKL 與分號" style="width:100%;height:auto;display:block"><div class="row"><button id="start" type="button">開始</button><span>按下後會發出兩聲嗶聲。</span></div><p id="message" role="status">這是預告畫面，尚未開放打字遊戲。</p><audio id="beep" preload="auto" src="beep.wav"></audio></section><p><a href="../index.html">← 回開發歷程</a></p></main><script>
const button=document.getElementById('start'),sound=document.getElementById('beep'),message=document.getElementById('message');
document.getElementById('keyboardImage').addEventListener('error',()=>message.textContent='圖片未載入，請檢查圖片檔案與路徑。');
button.addEventListener('click',async()=>{button.disabled=true;sound.currentTime=0;try{await sound.play();message.textContent='嗶嗶！這是遊戲預告，目前還不能玩。';}catch(e){message.textContent='聲音無法播放，請檢查聲音檔與路徑，並確認瀏覽器允許播放。';button.disabled=false;}});
sound.addEventListener('ended',()=>button.disabled=false);sound.addEventListener('error',()=>{button.disabled=false;message.textContent='聲音檔未載入，請檢查是否一起上傳、位置及檔名是否相符。';});
</script></body></html>
