<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英打遊戲版本 4</title><style>
[hidden]{display:none!important}:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#243e38;background:#f5f3ec;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:36px 24px}h1{font-size:clamp(28px,4.5vw,44px);line-height:1.3;margin:12px 0 18px}h2{font-size:22px}p{margin:12px 0}a{color:#205d50}button,input{font:inherit}button,.action{display:inline-block;padding:12px 22px;border:1px solid #426d5e;background:#426d5e;color:#fff;border-radius:12px;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#284c40}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled),.action:hover{filter:brightness(.95)}:focus-visible{outline:3px solid #b16b35;outline-offset:4px}.eyebrow{font-size:13px;letter-spacing:.14em;color:#596f62}.panel{background:white;border:1px solid #ccd7ce;border-radius:20px;padding:24px;margin:20px 0}.muted,small{color:#526459}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#message{min-height:2em}input[type=url]{width:100%;padding:12px;border:1px solid #8a9f90;border-radius:9px;margin:6px 0 14px}label{display:block}details{background:#eef0e8;border-radius:14px;padding:16px;margin-top:24px}summary{cursor:pointer;font-weight:650}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:white;border:1px solid #ccd7ce;border-radius:18px;padding:24px;min-height:260px}.card p{flex:1}.badge{font-size:12px;color:#526459}.card a{margin-top:14px}a[aria-disabled=true]{color:#6b716c;background:#eeeee8;border-color:#bbb;cursor:not-allowed}.keyboard-wrap{overflow:auto;padding:10px 0}.keyboard{min-width:620px;max-width:870px;margin:auto;background:#d5ddd5;padding:14px;border-radius:18px}.keyrow{display:flex;justify-content:center;gap:6px;margin:6px 0}.key{display:grid;place-items:center;width:52px;height:48px;border-radius:8px;border:1px solid #98ad9e;border-bottom-width:4px;background:#f9faf4;color:#53645a;font-size:20px;font-weight:700}.key.practice{background:#e4bbab;color:#452e25}.key.lit{background:#a1332e;color:white;border-color:#682a28;box-shadow:0 0 0 3px #f1d6bc;transform:translateY(-2px)}.key.lit:after{content:'●';font-size:7px;line-height:1}.score{display:flex;gap:14px;flex-wrap:wrap}.score span{background:#edf1e9;padding:8px 14px;border-radius:10px}.score b{font-size:26px}.target{font-size:80px;font-weight:800;line-height:1.2;margin:14px}.game{text-align:center;outline-offset:5px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.controls label{flex:1;min-width:200px}input[type=range]{width:100%;accent-color:#426d5e}.sky{height:300px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#e2edf0,#f5f0df);border-bottom:8px solid #a5b794}.sky:before{content:'落地前，按下對應的英文字母';position:absolute;top:12px;left:16px;color:#506664;font-size:13px}.falling{position:absolute;left:50%;transform:translateX(-50%);width:60px;height:60px;display:grid;place-items:center;border-radius:16px;background:#ab4939;color:white;font-size:36px;font-weight:bold;box-shadow:0 6px 0 #d2aa92}.help{font-size:14px}body.completed .sky{background:#e4ebdf}@media(max-width:700px){main{padding:22px 14px}.cards{grid-template-columns:1fr}.card{min-height:190px}.panel{padding:16px}}
</style></head><body><main><a href="../index.html">← 回開發歷程</a><p class="eyebrow">VERSION 04 · CATCH THE LETTERS</p><h1>英打遊戲版本 4</h1><p>在字母落地之前按對按鍵。練習 A S D F G H J K L ;。</p><section class="panel"><div class="controls"><label for="speed">每個字母落地時間：<strong id="speedLabel">8 秒</strong><input id="speed" type="range" min="3" max="14" step="1" value="8"><small>秒數越大，掉得越慢。初學可用 10～14 秒。</small></label><label><input id="auto" type="checkbox"> 漸進加速：每答對三題縮短一秒，最快三秒</label></div><div class="row"><button id="start">開始／重新開始</button><button id="pause" class="secondary" disabled>暫停</button><span>目前落地時間：<b id="actual">8 秒</b></span></div></section><section id="play" tabindex="0" class="panel game" aria-label="掉落字母遊戲"><div class="score"><span>接住 <b id="score">0</b></span><span>落地 <b id="miss">0</b></span><span>按錯 <b id="wrong">0</b></span><span>完成 <b id="round">0</b> / 10</span></div><div id="sky" class="sky"><div id="falling" class="falling" hidden>—</div></div><div class="keyboard-wrap"><div class="keyboard" aria-label="英文鍵盤，紅色並有圓點的按鍵是目前目標"><div class="keyrow"><span class="key " data-key="q">Q</span><span class="key " data-key="w">W</span><span class="key " data-key="e">E</span><span class="key " data-key="r">R</span><span class="key " data-key="t">T</span><span class="key " data-key="y">Y</span><span class="key " data-key="u">U</span><span class="key " data-key="i">I</span><span class="key " data-key="o">O</span><span class="key " data-key="p">P</span></div><div class="keyrow"><span class="key practice" data-key="a">A</span><span class="key practice" data-key="s">S</span><span class="key practice" data-key="d">D</span><span class="key practice" data-key="f">F</span><span class="key practice" data-key="g">G</span><span class="key practice" data-key="h">H</span><span class="key practice" data-key="j">J</span><span class="key practice" data-key="k">K</span><span class="key practice" data-key="l">L</span><span class="key practice" data-key=";">;</span></div><div class="keyrow"><span class="key " data-key="z">Z</span><span class="key " data-key="x">X</span><span class="key " data-key="c">C</span><span class="key " data-key="v">V</span><span class="key " data-key="b">B</span><span class="key " data-key="n">N</span><span class="key " data-key="m">M</span></div></div></div><p id="message" role="status">按開始，用實體鍵盤接住字母；每次只出現一個。</p></section><p class="help">請切換英文輸入。按錯不消除目標；落地記錄一次，不扣生命。長按不連續消除。調整設定、切換分頁或離開視窗會暫停，按繼續恢復。</p></main><script>
const $=id=>document.getElementById(id);const keyNodes=[...document.querySelectorAll('[data-key]')];
function chooseKey(keys,previous,random=Math.random){const pool=keys.filter(k=>k!==previous);return pool[Math.floor(random()*pool.length)];}
function markKey(key){keyNodes.forEach(node=>node.classList.toggle('lit',node.dataset.key===key));}
function isControl(target){return target instanceof Element&&!!target.closest('input,select,textarea,button,a,summary');}
function inputKey(e){return e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.repeat?null:String(e.key).toLowerCase();}

const KEYS=['a','s','d','f','g','h','j','k','l',';'];const ROUND_LENGTH=10;
let state={running:false,paused:false,score:0,miss:0,wrong:0,done:0,target:null,y:0},lastTime=null;
function fallSeconds(base,score,auto){return Math.max(3,base-(auto?Math.floor(score/3):0));}
function seconds(){return fallSeconds(Number($('speed').value),state.score,$('auto').checked);}
function render(){$('score').textContent=state.score;$('miss').textContent=state.miss;$('wrong').textContent=state.wrong;$('round').textContent=state.done;$('speedLabel').textContent=$('speed').value+' 秒';$('actual').textContent=seconds()+' 秒';$('pause').disabled=!state.running;$('pause').textContent=state.paused?'繼續':'暫停';$('falling').hidden=!state.running;$('falling').style.top=(12+state.y*($('sky').clientHeight-80))+'px';}
function next(){state.target=chooseKey(KEYS,state.target);state.y=0;$('falling').textContent=state.target.toUpperCase();markKey(state.target);}
function finishLetter(hit){if(hit)state.score++;else state.miss++;state.done++;
 if(state.done>=ROUND_LENGTH){state.running=false;state.target=null;markKey(null);$('message').textContent='本回合完成！接住 '+state.score+' 個，落地 '+state.miss+' 個。可調整速度再挑戰。';}
 else{next();$('message').textContent=hit?'接住了！準備下一個。':'落地了，沒關係，下一個再試。';}render();}
function advance(dt){if(!state.running||state.paused)return;state.y+=dt/seconds();if(state.y>=1)finishLetter(false);render();}
function start(){state={running:true,paused:false,score:0,miss:0,wrong:0,done:0,target:null,y:0};lastTime=null;next();render();$('message').textContent='開始！一回合十個字母，落地不結束遊戲。';$('play').focus();}
function pause(value){if(!state.running)return;state.paused=value;lastTime=null;render();$('message').textContent=value?'已暫停，按繼續後再玩。':'繼續挑戰！';}
$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>{pause(!state.paused);$('play').focus();});
$('speed').addEventListener('input',()=>{render();});$('auto').addEventListener('change',render);
for(const id of ['speed','auto'])$(id).addEventListener('focus',()=>pause(true));
document.addEventListener('keydown',e=>{if(!state.running||state.paused||isControl(e.target))return;const key=inputKey(e);if(!key||!/^[a-z;]$/.test(key))return;e.preventDefault();if(key===state.target)finishLetter(true);else{state.wrong++;$('message').textContent='不是這一個，請按 '+state.target.toUpperCase()+'。';render();}});
function frame(t){if(lastTime!==null)advance(Math.min((t-lastTime)/1000,.1));lastTime=t;requestAnimationFrame(frame);}
window.addEventListener('blur',()=>pause(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true);});
render();requestAnimationFrame(frame);

</script></body></html>
